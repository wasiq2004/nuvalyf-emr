name: medflow-emr

# Configuration comes from a .env file next to this one - copy .env.example.

x-owner-url: &owner-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medflow}
x-app-url: &app-url postgres://medflow_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medflow}
x-platform-url: &platform-url postgres://medflow_platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medflow}
x-provisioner-url: &provisioner-url postgres://medflow_provisioner:${PROVISIONER_DB_PASSWORD:?Set PROVISIONER_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medflow}

# Every connection to the database is TLS, and the app checks the database's
# certificate against our own CA. Make the certificates once with
# scripts/ops/make-db-certs.sh (docs/OPERATIONS.md, "Database TLS").
x-db-tls: &db-tls
  DATABASE_SSL: verify-full
  DATABASE_SSL_CA: /certs/ca.crt

x-ca-mount: &ca-mount ${DB_CERTS_DIR:-./certs}/ca.crt:/certs/ca.crt:ro

# Container logs rotate at 20 MB x 10 files per service (~200 MB cap). Ship
# them elsewhere for longer retention; see docs/OPERATIONS.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
    # No host port: only the other services reach it. For local access, see
    # docker-compose.override.yml.
    #
    # TLS on, TLS 1.2 at least, and db/pg_hba.conf refuses any network
    # connection without it. Postgres insists its key is private to it, so the
    # mounted certificate is copied in and handed to the postgres user before
    # the normal entrypoint starts. If the certificate files are missing, Docker
    # mounts empty directories in their place, so check for real files first.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        { test -f /certs/server.crt && test -f /certs/server.key; } ||
        { echo "NuvaLyf database: TLS certificates not found. Run scripts/ops/make-db-certs.sh on the server and set DB_CERTS_DIR to that folder (docs/OPERATIONS.md, Database TLS)." >&2; exit 1; } &&
        mkdir -p /var/lib/postgresql/tls &&
        cp /certs/server.crt /certs/server.key /var/lib/postgresql/tls/ &&
        chown -R postgres:postgres /var/lib/postgresql/tls &&
        chmod 600 /var/lib/postgresql/tls/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/tls/server.key
        -c ssl_min_protocol_version=TLSv1.2
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c log_connections=on
        -c log_disconnections=on
        -c log_timezone=Asia/Kolkata
        -c "log_line_prefix=%m [%p] %q%u@%d from %h "
    volumes:
      - medflow_data:/var/lib/postgresql/data
      - ${DB_CERTS_DIR:-./certs}/server.crt:/certs/server.crt:ro
      - ${DB_CERTS_DIR:-./certs}/server.key:/certs/server.key:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      # Checks the server, not POSTGRES_DB: setup creates that database if it is missing.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `docker compose up`: creates the runtime DB roles, applies
  # migrations + security policies, and creates the first Super Admin.
  # Never deletes data.
  setup:
    logging: *logging
    build:
      context: .
      target: tools
    restart: "no"
    environment:
      <<: *db-tls
      DATABASE_OWNER_URL: *owner-url
      DATABASE_URL: *app-url
      PLATFORM_DATABASE_URL: *platform-url
      PROVISIONER_DATABASE_URL: *provisioner-url
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    volumes:
      - *ca-mount
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *logging
    build:
      context: .
      target: runner
    restart: unless-stopped
    # Reached through the platform's reverse proxy (Dokploy/Traefik, Caddy,
    # nginx) on the Docker network, so no host port is published: the host's
    # 3000 is often taken (Dokploy's own dashboard uses it). Locally,
    # docker-compose.override.yml publishes it.
    expose:
      - "3000"
    environment:
      <<: *db-tls
      DATABASE_URL: *app-url
      PLATFORM_DATABASE_URL: *platform-url
      # Remove this line to switch off clinic onboarding and admin rescue.
      PROVISIONER_DATABASE_URL: *provisioner-url
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?Set PLATFORM_AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # Reverse proxies in front of the app (see docs/OPERATIONS.md).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      DATA_ENCRYPTION_KEYS_OLD: ${DATA_ENCRYPTION_KEYS_OLD:-}
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-cloud}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
    volumes:
      - *ca-mount
    depends_on:
      setup:
        condition: service_completed_successfully

  # Appointment reminders and WhatsApp broadcasts. Safe to scale: only one
  # replica works at a time (advisory lock).
  worker:
    logging: *logging
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *db-tls
      DATABASE_URL: *app-url
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      DATA_ENCRYPTION_KEYS_OLD: ${DATA_ENCRYPTION_KEYS_OLD:-}
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-cloud}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
    volumes:
      - *ca-mount
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  # Not "postgres_data": that name belongs to the v1 stack, which used the same
  # project name. v2 keeps its data apart and never writes to the v1 volume.
  medflow_data:
