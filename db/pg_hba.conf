# Who may connect to the NuvaLyf database, and how (mounted into the db
# container; see docker-compose.yml).
#
# Inside the container only (backups, health check): the local socket.
local   all   all                 trust
# Everything over the network must use TLS and a SCRAM password.
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
# A connection without TLS is refused outright.
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
